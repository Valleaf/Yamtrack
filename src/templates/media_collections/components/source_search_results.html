{% if error %}
  <p class="text-red-400 text-sm mt-2">{{ error }}</p>
{% elif results %}
  <ul class="space-y-2 mt-2 border border-[#39404b] rounded-md overflow-hidden">
    {% for result in results %}
    <li>
      <button type="button"
              class="w-full flex items-center gap-3 px-3 py-2 bg-[#2c3136] hover:bg-[#39404b] text-left transition-colors"
              onclick="
                document.getElementById('id_source_id').value = '{{ result.id }}';
                document.getElementById('id_name').value = '{{ result.name|escapejs }}';
                document.getElementById('selected-name').textContent = '{{ result.name|escapejs }}';
                document.getElementById('selected-collection').classList.remove('hidden');
                document.getElementById('search-results').innerHTML = '';
                document.getElementById('collection-search').value = '{{ result.name|escapejs }}';
              ">
        {% if result.image %}
        <img src="{{ result.image }}" alt="{{ result.name }}"
             class="w-12 h-12 object-cover rounded shrink-0"
             onerror="this.style.display='none'">
        {% endif %}
        <span class="text-sm text-white">{{ result.name }}</span>
      </button>
    </li>
    {% endfor %}
  </ul>
{% elif source and query|length >= 2 %}
  <p class="text-gray-500 text-sm mt-2">No results found for "{{ query }}".</p>
{% endif %}
