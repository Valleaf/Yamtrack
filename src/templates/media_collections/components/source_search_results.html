{% if error %}
  <p class="text-red-400 text-sm mt-2">{{ error }}</p>
{% elif results %}
  <ul class="space-y-2 mt-2 border border-[#39404b] rounded-md overflow-hidden">
    {% for result in results %}
    <li>
      <button type="button"
              class="w-full flex items-center gap-3 px-3 py-2 bg-[#2c3136] hover:bg-[#39404b] text-left transition-colors"
              onclick="
                const idInput = document.querySelector('input[name=source_id]');
                const nameInput = document.getElementById('col-name-input') || document.getElementById('id_name');
                if (idInput) idInput.value = '{{ result.id }}';
                if (nameInput) nameInput.value = '{{ result.name|escapejs }}';
                const alpineRoot = this.closest('[x-data]');
                if (alpineRoot && alpineRoot._x_dataStack) {
                  alpineRoot._x_dataStack[0].sourceId = '{{ result.id }}';
                  alpineRoot._x_dataStack[0].selectedName = '{{ result.name|escapejs }}';
                }
                const selectedName = document.getElementById('selected-name');
                const selectedCollection = document.getElementById('selected-collection');
                if (selectedName) selectedName.textContent = '{{ result.name|escapejs }}';
                if (selectedCollection) selectedCollection.classList.remove('hidden');
                const results = document.getElementById('search-results') || document.getElementById('source-search-results');
                if (results) results.innerHTML = '';
                const searchInput = document.getElementById('collection-search') || document.getElementById('source-search-input');
                if (searchInput) searchInput.value = '{{ result.name|escapejs }}';
              ">
        {% if result.image %}
        <img src="{{ result.image }}" alt="{{ result.name }}"
             class="w-12 h-12 object-cover rounded shrink-0"
             onerror="this.style.display='none'">
        {% endif %}
        <span class="text-sm text-white">{{ result.name }}</span>
      </button>
    </li>
    {% endfor %}
  </ul>
{% elif source and query|length >= 2 %}
  <p class="text-gray-500 text-sm mt-2">No results found for "{{ query }}".</p>
{% endif %}
