<div class="p-4" id="collections-{{ media_type }}-{{ media_id }}">
  <h3 class="text-sm font-semibold text-gray-300 mb-3">Add to Collection</h3>
  {% if user_collections %}
    <ul class="space-y-2">
      {% for collection in user_collections %}
      <li class="flex items-center justify-between"
          hx-post="{% url 'collection_item_toggle' %}"
          hx-target="#collections-{{ media_type }}-{{ media_id }}"
          hx-swap="outerHTML"
          hx-include="[name='csrfmiddlewaretoken'], [name='collection_id_{{ collection.id }}'], [name='source'], [name='media_type'], [name='media_id']">
        <span class="text-sm text-gray-200 truncate mr-3">{{ collection.name }}</span>
        <form method="post" action="{% url 'collection_item_toggle' %}">
          {% csrf_token %}
          <input type="hidden" name="collection_id" value="{{ collection.id }}">
          <input type="hidden" name="source" value="{{ source }}">
          <input type="hidden" name="media_type" value="{{ media_type }}">
          <input type="hidden" name="media_id" value="{{ media_id }}">
          <button type="submit"
                  class="px-3 py-1 text-xs rounded transition-colors {% if collection.has_item %}bg-indigo-600 text-white hover:bg-indigo-700{% else %}bg-[#2c3136] text-gray-300 hover:bg-[#39404b]{% endif %}">
            {% if collection.has_item %}Remove{% else %}Add{% endif %}
          </button>
        </form>
      </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-sm text-gray-400">No collections yet.</p>
    <a href="{% url 'collection_create' %}" class="text-sm text-indigo-400 hover:underline mt-1 inline-block">Create one →</a>
  {% endif %}
</div>
