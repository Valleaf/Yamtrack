{% extends "base.html" %}
{% load static %}

{% block title %}Edit {{ collection.name }} - Yamtrack{% endblock title %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="mb-8">
    <div class="flex items-center gap-2 text-sm text-gray-400 mb-2">
      <a href="{% url 'media_collections' %}" class="hover:text-white">Collections</a>
      <span>/</span>
      <a href="{% url 'collection_detail' collection.id %}" class="hover:text-white">{{ collection.name }}</a>
      <span>/</span>
      <span class="text-white">Edit</span>
    </div>
    <h1 class="text-3xl font-bold">Edit Collection</h1>
  </div>

  <div class="bg-[#1e2329] rounded-lg p-6">
    <form method="post">
      {% csrf_token %}
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-300 mb-2" for="id_name">Name *</label>
        <input type="text" name="name" id="id_name"
               value="{{ collection.name }}"
               class="w-full px-4 py-2 bg-[#2c3136] border border-[#39404b] rounded-md text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
               required>
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-300 mb-2" for="id_description">Description</label>
        <textarea name="description" id="id_description" rows="3"
                  class="w-full px-4 py-2 bg-[#2c3136] border border-[#39404b] rounded-md text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none">{{ collection.description }}</textarea>
      </div>
      <div class="flex gap-3">
        <button type="submit"
                class="px-6 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors font-medium">
          Save
        </button>
        <a href="{% url 'collection_detail' collection.id %}"
           class="px-6 py-2 bg-[#2c3136] text-gray-300 rounded-md hover:bg-[#39404b] transition-colors">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
